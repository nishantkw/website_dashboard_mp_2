services:
  postgres:
    image: postgres:16-alpine
    container_name: pmjay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pmjay_dashboard
    ports:
      - "5433:5432"
    volumes:
      - pmjay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pmjay_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pmjay_pg_data:
